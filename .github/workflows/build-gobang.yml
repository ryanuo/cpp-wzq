name: Build Gobang AI (Qt)

on:
  workflow_dispatch:
    inputs:
      cnb_tag:
        description: '手动验证 CNB 上传时指定 Release tag（默认 main 分支名）'
        required: false
        type: string
  # 推送 v* tag 时自动构建并发布 Release（可从 Releases 下载对应系统版本）
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows
  # ============================================================
  build-windows:

    name: Windows / Qt 6.8.3 / MSVC 2022

    runs-on: windows-2022

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # ========================================================
      # Install Qt
      # ========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true


      # ========================================================
      # Check Environment
      # ========================================================
      - name: Check Windows Environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Windows"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Visual Studio:"

          # vswhere 实际位于 (x86) 目录, 回退到 64 位路径
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            $vsWhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vsWhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vsWhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            Write-Error "Visual Studio 2022 with MSVC was not found."
            exit 1
          }

          Write-Host $vsPath

          Write-Host ""
          Write-Host "Qt6_DIR:"
          Write-Host $env:Qt6_DIR


      # ========================================================
      # Configure CMake
      # ========================================================
      - name: Configure Windows
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64


      # ========================================================
      # Build
      # ========================================================
      - name: Build Windows
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ========================================================
      # Test (headless 联机协议自测)
      # ========================================================
      - name: Run Tests
        shell: powershell
        run: |
          ctest `
            --test-dir build `
            -C Release `
            --output-on-failure


      # ========================================================
      # Prepare Dist
      # ========================================================
      - name: Prepare Windows Dist
        shell: powershell
        run: |
          $dist = "dist"

          if (Test-Path $dist) {
            Remove-Item `
              -Path $dist `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dist | Out-Null


      # ========================================================
      # Deploy Qt
      # ========================================================
      - name: Deploy Qt Windows
        shell: powershell
        run: |
          $exe = "build/Release/gobang.exe"
          $dist = "dist"

          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found:"
            Write-Error $exe
            exit 1
          }

          Write-Host "Copy executable:"
          Write-Host $exe

          Copy-Item `
            -Path $exe `
            -Destination $dist

          Write-Host ""
          Write-Host "Running windeployqt..."

          windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            "$dist/gobang.exe"


      # ========================================================
      # Check Windows Output
      # ========================================================
      - name: Check Windows Output
        shell: powershell
        run: |
          $dist = "dist"

          Write-Host "========================================"
          Write-Host "Windows Output"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $dist `
            -Recurse


      # ========================================================
      # Package Windows
      # ========================================================
      - name: Package Windows
        shell: powershell
        run: |
          $zip = "gobang-windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item `
              -Path $zip `
              -Force
          }

          Compress-Archive `
            -Path "dist/*" `
            -DestinationPath $zip

          Write-Host ""
          Write-Host "Package created:"
          Write-Host $zip


      # ========================================================
      # Upload Windows Artifact
      # ========================================================
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-windows-x64
          path: gobang-windows-x64.zip

      # tag 触发时发布到 GitHub Release（三个 job 各自上传，自动合并到同一 Release）
      # changelog：上一 tag 以来的 feat/fix 提交（三平台生成内容一致，body 相同不冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-windows-x64.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false



  # ============================================================
  # macOS
  # ============================================================
  build-macos:

    name: macOS 15 / Qt 6.8.3 / Clang

    runs-on: macos-15

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # ========================================================
      # Install Qt
      # ========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          modules: qtmultimedia
          cache: true


      # ========================================================
      # Check Environment
      # ========================================================
      - name: Check macOS Environment
        run: |
          echo "========================================"
          echo "macOS"
          echo "========================================"

          echo ""
          echo "System:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Qt:"
          qmake --version


      # ========================================================
      # Configure CMake
      # ========================================================
      - name: Configure macOS
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0


      # ========================================================
      # Build
      # ========================================================
      - name: Build macOS
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel


      # ========================================================
      # Test (headless 联机协议自测)
      # ========================================================
      - name: Run Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure


      # ========================================================
      # Check APP
      # ========================================================
      - name: Check macOS Application
        run: |
          APP="build/gobang.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Application not found:"
            echo "$APP"

            echo ""
            echo "Build directory:"
            find build \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo "Application found:"
          echo "$APP"


      # ========================================================
      # Deploy Qt
      # ========================================================
      - name: Deploy Qt macOS
        run: |
          APP="build/gobang.app"

          echo "========================================"
          echo "Running macdeployqt"
          echo "========================================"

          macdeployqt "$APP"


      # ========================================================
      # Check Executable
      # ========================================================
      - name: Check macOS Executable
        run: |
          EXEC="build/gobang.app/Contents/MacOS/gobang"

          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Executable not found:"
            echo "$EXEC"
            exit 1
          fi

          echo "Executable:"
          file "$EXEC"


      # ========================================================
      # Package macOS
      # ========================================================
      - name: Package macOS
        run: |
          cd build

          rm -f "$GITHUB_WORKSPACE/gobang-macos.zip"

          zip \
            -r \
            "$GITHUB_WORKSPACE/gobang-macos.zip" \
            gobang.app

          echo ""
          echo "Package created:"
          echo "$GITHUB_WORKSPACE/gobang-macos.zip"


      # ========================================================
      # Upload macOS Artifact
      # ========================================================
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-macos
          path: gobang-macos.zip

      # tag 触发时发布到 GitHub Release（body 与 Windows job 相同，无冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish macOS Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-macos.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false



  # ============================================================
  # Linux
  # ============================================================
  build-linux:

    name: Linux / Qt 6.8.3 / GCC

    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # --------------------------------------------------------
      # Install Qt
      # --------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          modules: qtmultimedia
          install-deps: true
          cache: true


      # --------------------------------------------------------
      # Check Environment
      # --------------------------------------------------------
      - name: Check Linux Environment
        run: |
          echo "========================================"
          echo "Linux"
          echo "========================================"

          echo ""
          echo "System:"
          head -2 /etc/os-release

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Compiler:"
          gcc --version | head -1


      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------
      - name: Configure Linux
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Linux
        run: |
          cmake \
            --build build \
            --parallel


      # --------------------------------------------------------
      # Test (headless 联机协议自测)
      # --------------------------------------------------------
      - name: Run Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure


      # --------------------------------------------------------
      # Check output
      # --------------------------------------------------------
      - name: Check Linux Executable
        run: |
          EXE="build/gobang"

          if [ ! -x "$EXE" ]; then
            echo "ERROR: Executable not found:"
            echo "$EXE"
            find build \
              -maxdepth 2 \
              -print
            exit 1
          fi

          echo "Executable found:"
          echo "$EXE"
          file "$EXE"


      # --------------------------------------------------------
      # Deploy Qt (拷贝运行库 + 插件 + 修正 rpath)
      # --------------------------------------------------------
      - name: Deploy Qt Linux
        run: |
          EXE="build/gobang"
          DIST="dist"
          QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)

          echo "========================================"
          echo "Copy executable and Qt libraries"
          echo "========================================"

          rm -rf "$DIST"
          mkdir -p "$DIST/lib" "$DIST/plugins"

          cp "$EXE" "$DIST/"

          # Qt 运行库
          ldd "$EXE" \
            | grep -oE '/[^ ]*libQt6[^ ]*' \
            | sort -u \
            | while read -r lib; do
                cp "$lib" "$DIST/lib/"
                echo "copied: $lib"
              done

          # ICU 库(部分发行版不预装)
          ldd "$EXE" \
            | grep -oE '/[^ ]*libicu[^ ]*' \
            | sort -u \
            | while read -r lib; do
                cp "$lib" "$DIST/lib/"
              done

          # Qt 插件: 平台 / 图片 / 多媒体 / 音频
          cp -r "$QT_PREFIX/plugins/platforms" "$DIST/plugins/"
          cp -r "$QT_PREFIX/plugins/imageformats" "$DIST/plugins/"
          if [ -d "$QT_PREFIX/plugins/multimedia" ]; then
            cp -r "$QT_PREFIX/plugins/multimedia" "$DIST/plugins/"
          fi
          if [ -d "$QT_PREFIX/plugins/audio" ]; then
            cp -r "$QT_PREFIX/plugins/audio" "$DIST/plugins/"
          fi

          # 插件依赖库 (libjpeg/libpng/libav* 等, 目标机可能缺失):
          # 排除 glibc/gcc 运行时核心, 其余全部拷入 dist/lib
          # (插件 rpath 已指向 $ORIGIN/../../lib, 可从此目录加载)
          for so in $(find "$DIST/plugins" -name '*.so'); do
            ldd "$so" \
              | grep -oE '/[^ ]*\.so(\.[0-9]+)*' \
              | grep -vE '/(libc|libm|libgcc_s|libstdc\+\+|ld-linux[^ ]*|libpthread|libdl|librt)\.so(\.|$)' \
              | sort -u \
              | while read -r lib; do
                  cp -n "$lib" "$DIST/lib/" 2>/dev/null || true
                done
          done

          # 修正 rpath: 可执行文件 -> lib/, 插件 -> 上级 lib/
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --set-rpath '$ORIGIN/lib' "$DIST/gobang"
          find "$DIST/plugins" -name '*.so' \
            -exec patchelf --set-rpath '$ORIGIN/../../lib' {} \;

          echo ""
          echo "Deploy output:"
          find "$DIST" -maxdepth 3 -print


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------
      - name: Package Linux
        run: |
          cd dist
          rm -f "$GITHUB_WORKSPACE/gobang-linux.zip"
          zip -r "$GITHUB_WORKSPACE/gobang-linux.zip" .
          echo ""
          echo "Package created:"
          echo "$GITHUB_WORKSPACE/gobang-linux.zip"


      # --------------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------------
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-linux
          path: gobang-linux.zip

      # tag 触发时发布到 GitHub Release（body 与其他 job 相同，无冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish Linux Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-linux.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false

  # ============================================================
  # 上传 Release 资产到 CNB（等三端构建全部完成后执行）
  # 前置: CNB 仓库已有该 tag 对应的 release（.cnb.yml tag_push 自动创建）
  # 依赖: GIT_PASSWORD secret（CNB 访问令牌）
  # 说明: 不用 cnbcool/attachments 插件（其 ##[set-output 输出为 Drone/CNB 格式,
  #       GitHub Actions 按自身规范解析报 "Required field 'name' is missing"）。
  #       改调 CNB OpenAPI（与插件同路径, 见实测日志）: 按 tag 取 release_id
  #       -> POST asset-upload-url -> PUT 上传 -> POST asset-upload-confirmation。
  #       注意: curl 赋值必须加 || true —— set -e 下 curl 失败会静默终止,
  #       状态码永远打印不出来, 无法诊断。
  # ============================================================
  upload-cnb:
    name: Upload Assets to CNB Release
    needs: [build-windows, build-macos, build-linux]
    # tag 触发自动跑；workflow_dispatch 用于手动验证（配合 inputs.cnb_tag 指定目标 release）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # 汇总三端 zip（artifact 名互不相同，merge 后都在 dist/ 下）
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.GIT_PASSWORD }}
          CNB_REPO: ryanuo/cpp-wzq
          CNB_TAG: ${{ inputs.cnb_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.cnb.cool/${CNB_REPO}/-/releases"
          AUTH="Authorization: Bearer ${CNB_TOKEN}"

          # 递归查找 JSON 中的指定 key（兼容响应结构差异, 找不到输出空串）
          jget() {
            python3 -c "
          import json, sys
          d = json.load(open('$1'))
          def find(o, k):
              if isinstance(o, dict):
                  if k in o: return o[k]
                  for v in o.values():
                      r = find(v, k)
                      if r is not None: return r
              elif isinstance(o, list):
                  for v in o:
                      r = find(v, k)
                      if r is not None: return r
              return None
          r = find(d, '$2')
          print(r if r is not None else '')
          "
          }

          # 1. 按 tag 取 release_id（|| true: 即使 curl 失败也要拿到状态码）
          # Accept: application/json 必须加 —— CNB 对 curl 默认 Accept: */* 返回 406
          HTTP=$(curl -s -o /tmp/cnb_release.json -w "%{http_code}" \
            -H "$AUTH" -H "Accept: application/json" \
            "$API/tags/${CNB_TAG}" || true)
          echo "GET release by tag: HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::取 release 失败 HTTP=${HTTP}, 响应: $(head -c 500 /tmp/cnb_release.json)"
            exit 1
          fi
          RELEASE_ID=$(jget /tmp/cnb_release.json id)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::未取到 release_id, 响应: $(head -c 500 /tmp/cnb_release.json)"
            exit 1
          fi
          echo "release_id=${RELEASE_ID} (tag=${CNB_TAG})"

          # 2-4. 逐个附件: 取上传地址 -> PUT 上传 -> 确认
          for f in dist/*.zip; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            echo "== 上传 ${NAME} (${SIZE} bytes) =="

            HTTP=$(curl -s -o /tmp/cnb_upload.json -w "%{http_code}" -H "$AUTH" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"asset_name\":\"${NAME}\",\"size\":${SIZE},\"overwrite\":true}" \
              "$API/${RELEASE_ID}/asset-upload-url" || true)
            echo "POST asset-upload-url: HTTP ${HTTP}"
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
              echo "::error::取上传地址失败 HTTP=${HTTP}, 响应: $(head -c 500 /tmp/cnb_upload.json)"
              exit 1
            fi
            # 诊断: 打印 201 响应体（字段名以实际响应为准）
            echo "upload-url 响应: $(head -c 300 /tmp/cnb_upload.json)"

            # 响应字段: upload_url(PUT 地址) + verify_url(完整确认地址, 含 token 与编码路径)
            UPLOAD_URL=$(jget /tmp/cnb_upload.json upload_url || true)
            VERIFY_URL=$(jget /tmp/cnb_upload.json verify_url || true)
            if [ -z "$UPLOAD_URL" ] || [ -z "$VERIFY_URL" ]; then
              echo "::error::上传地址响应缺字段(upload_url/verify_url), 响应: $(head -c 500 /tmp/cnb_upload.json)"
              exit 1
            fi

            HTTP=$(curl -s -o /tmp/cnb_put.json -w "%{http_code}" -X PUT \
              --data-binary @"$f" -H "Content-Type: application/octet-stream" \
              "$UPLOAD_URL" || true)
            echo "PUT upload: HTTP ${HTTP}"
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
              echo "::error::PUT 上传失败 HTTP=${HTTP}, 响应: $(head -c 500 /tmp/cnb_put.json)"
              exit 1
            fi

            HTTP=$(curl -s -o /tmp/cnb_confirm.json -w "%{http_code}" -H "$AUTH" \
              -H "Accept: application/json" -X POST "$VERIFY_URL" || true)
            echo "POST confirm: HTTP ${HTTP}"
            if [ "$HTTP" != "200" ]; then
              echo "::error::确认上传失败 HTTP=${HTTP}, 响应: $(head -c 500 /tmp/cnb_confirm.json)"
              exit 1
            fi

            echo "已上传: ${NAME}"
          done

          echo "全部附件已上传到 CNB Release: ${CNB_TAG}"
          echo "https://cnb.cool/${CNB_REPO}/-/releases/tag/${CNB_TAG}"
