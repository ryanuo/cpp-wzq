name: Build Gobang AI (Qt)

on:
  workflow_dispatch:
    inputs:
      cnb_tag:
        description: '手动验证 CNB 上传时指定 Release tag（默认 main 分支名）'
        required: false
        type: string
  # 推送 v* tag 时自动构建并发布 Release（可从 Releases 下载对应系统版本）
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows
  # ============================================================
  build-windows:

    name: Windows / Qt 6.8.3 / MSVC 2022

    runs-on: windows-2022

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # ========================================================
      # Install Qt
      # ========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true


      # ========================================================
      # Check Environment
      # ========================================================
      - name: Check Windows Environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Windows"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Visual Studio:"

          # vswhere 实际位于 (x86) 目录, 回退到 64 位路径
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            $vsWhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vsWhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vsWhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            Write-Error "Visual Studio 2022 with MSVC was not found."
            exit 1
          }

          Write-Host $vsPath

          Write-Host ""
          Write-Host "Qt6_DIR:"
          Write-Host $env:Qt6_DIR


      # ========================================================
      # Configure CMake
      # ========================================================
      - name: Configure Windows
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64


      # ========================================================
      # Build
      # ========================================================
      - name: Build Windows
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ========================================================
      # Test (headless 联机协议自测)
      # ========================================================
      - name: Run Tests
        shell: powershell
        run: |
          ctest `
            --test-dir build `
            -C Release `
            --output-on-failure


      # ========================================================
      # Prepare Dist
      # ========================================================
      - name: Prepare Windows Dist
        shell: powershell
        run: |
          $dist = "dist"

          if (Test-Path $dist) {
            Remove-Item `
              -Path $dist `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dist | Out-Null


      # ========================================================
      # Deploy Qt
      # ========================================================
      - name: Deploy Qt Windows
        shell: powershell
        run: |
          $exe = "build/Release/gobang.exe"
          $dist = "dist"

          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found:"
            Write-Error $exe
            exit 1
          }

          Write-Host "Copy executable:"
          Write-Host $exe

          Copy-Item `
            -Path $exe `
            -Destination $dist

          Write-Host ""
          Write-Host "Running windeployqt..."

          windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            "$dist/gobang.exe"


      # ========================================================
      # Check Windows Output
      # ========================================================
      - name: Check Windows Output
        shell: powershell
        run: |
          $dist = "dist"

          Write-Host "========================================"
          Write-Host "Windows Output"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $dist `
            -Recurse


      # ========================================================
      # Slim Windows Bundle（减包: 32MB -> ~15MB）
      #   删除软件 OpenGL 渲染器（QWidget 用 raster 引擎, 不加载 GL;
      #   opengl32sw 是给无 GPU 驱动环境的备用软件渲染, D3Dcompiler 是其配套）
      #   ffmpeg(avcodec 等) 是 Windows QMediaPlayer 必需后端, 保留
      # ========================================================
      - name: Slim Windows Bundle
        shell: powershell
        run: |
          Remove-Item `
            -Path "dist/opengl32sw.dll" `
            -Force `
            -ErrorAction SilentlyContinue
          Remove-Item `
            -Path "dist/D3Dcompiler_47.dll" `
            -Force `
            -ErrorAction SilentlyContinue

          $size = (Get-ChildItem dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Slim size: $([math]::Round($size,1)) MB"


      # ========================================================
      # Package Windows
      # ========================================================
      - name: Package Windows
        shell: powershell
        run: |
          $zip = "gobang-windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item `
              -Path $zip `
              -Force
          }

          Compress-Archive `
            -Path "dist/*" `
            -DestinationPath $zip

          Write-Host ""
          Write-Host "Package created:"
          Write-Host $zip


      # ========================================================
      # Upload Windows Artifact
      # ========================================================
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-windows-x64
          path: gobang-windows-x64.zip

      # tag 触发时发布到 GitHub Release（三个 job 各自上传，自动合并到同一 Release）
      # changelog：上一 tag 以来的 feat/fix 提交（三平台生成内容一致，body 相同不冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-windows-x64.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false



  # ============================================================
  # macOS
  # ============================================================
  build-macos:

    name: macOS 15 / Qt 6.8.3 / Clang

    runs-on: macos-15

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # ========================================================
      # Install Qt
      # ========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          modules: qtmultimedia
          cache: true


      # ========================================================
      # Check Environment
      # ========================================================
      - name: Check macOS Environment
        run: |
          echo "========================================"
          echo "macOS"
          echo "========================================"

          echo ""
          echo "System:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Qt:"
          qmake --version


      # ========================================================
      # Configure CMake
      # ========================================================
      - name: Configure macOS
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0


      # ========================================================
      # Build
      # ========================================================
      - name: Build macOS
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel


      # ========================================================
      # Test (headless 联机协议自测)
      # ========================================================
      - name: Run Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure


      # ========================================================
      # Check APP
      # ========================================================
      - name: Check macOS Application
        run: |
          APP="build/gobang.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Application not found:"
            echo "$APP"

            echo ""
            echo "Build directory:"
            find build \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo "Application found:"
          echo "$APP"


      # ========================================================
      # Deploy Qt
      # ========================================================
      - name: Deploy Qt macOS
        run: |
          APP="build/gobang.app"

          echo "========================================"
          echo "Running macdeployqt"
          echo "========================================"

          macdeployqt "$APP"


      # ========================================================
      # Slim Bundle（减包: 82MB -> ~35MB）
      #   1. 架构瘦身: Qt 官方框架是 universal(x86_64+arm64), runner 为 arm64,
      #      x86_64 冗余删掉（lipo -thin, 体积约减半）
      #   2. 删 ffmpeg 后端: macOS 播放走 AVFoundation(darwin 插件), 不依赖 ffmpeg
      #      （Windows/Linux 的 QMediaPlayer 需要 ffmpeg, 不能删）
      #   3. 删未链接框架: QtDBus/QtSvg（可执行文件未链接; iconengines 依赖 QtSvg 一并删）
      # ========================================================
      - name: Slim macOS Bundle
        run: |
          APP="build/gobang.app"

          echo "--- 1. lipo -thin arm64 (universal -> arm64) ---"
          find "$APP" -type f \( -perm -111 -o -name '*.dylib' \) -print0 | while IFS= read -r -d '' f; do
            if lipo -info "$f" 2>/dev/null | grep -qE 'x86_64 arm64|arm64 x86_64'; then
              lipo -thin arm64 -output "$f.thin" "$f" && mv "$f.thin" "$f"
              echo "  thinned: ${f#$APP/}"
            fi
          done

          echo "--- 2. 删除 ffmpeg 全家桶（macOS 用 darwin/AVFoundation 后端） ---"
          rm -f "$APP"/Contents/Frameworks/libavcodec*.dylib \
                "$APP"/Contents/Frameworks/libavformat*.dylib \
                "$APP"/Contents/Frameworks/libavutil*.dylib \
                "$APP"/Contents/Frameworks/libswscale*.dylib \
                "$APP"/Contents/Frameworks/libswresample*.dylib
          rm -f "$APP"/Contents/PlugIns/multimedia/libffmpegmediaplugin.dylib

          echo "--- 3. 删除未链接的闲置框架/插件 ---"
          rm -rf "$APP"/Contents/Frameworks/QtDBus.framework \
                 "$APP"/Contents/Frameworks/QtSvg.framework \
                 "$APP"/Contents/PlugIns/iconengines

          echo "--- 瘦身后体积 ---"
          du -sh "$APP"


      # ========================================================
      # Check Executable
      # ========================================================
      - name: Check macOS Executable
        run: |
          EXEC="build/gobang.app/Contents/MacOS/gobang"

          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Executable not found:"
            echo "$EXEC"
            exit 1
          fi

          echo "Executable:"
          file "$EXEC"


      # ========================================================
      # Package macOS
      # ========================================================
      - name: Package macOS
        run: |
          cd build

          rm -f "$GITHUB_WORKSPACE/gobang-macos.zip"

          zip \
            -r \
            "$GITHUB_WORKSPACE/gobang-macos.zip" \
            gobang.app

          echo ""
          echo "Package created:"
          echo "$GITHUB_WORKSPACE/gobang-macos.zip"


      # ========================================================
      # Upload macOS Artifact
      # ========================================================
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-macos
          path: gobang-macos.zip

      # tag 触发时发布到 GitHub Release（body 与 Windows job 相同，无冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish macOS Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-macos.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false



  # ============================================================
  # Linux
  # ============================================================
  build-linux:

    name: Linux / Qt 6.8.3 / GCC

    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：生成 changelog 需要上一 tag 对比


      # --------------------------------------------------------
      # Install Qt
      # --------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          modules: qtmultimedia
          install-deps: true
          cache: true


      # --------------------------------------------------------
      # Check Environment
      # --------------------------------------------------------
      - name: Check Linux Environment
        run: |
          echo "========================================"
          echo "Linux"
          echo "========================================"

          echo ""
          echo "System:"
          head -2 /etc/os-release

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Compiler:"
          gcc --version | head -1


      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------
      - name: Configure Linux
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Linux
        run: |
          cmake \
            --build build \
            --parallel


      # --------------------------------------------------------
      # Test (headless 联机协议自测)
      # --------------------------------------------------------
      - name: Run Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure


      # --------------------------------------------------------
      # Check output
      # --------------------------------------------------------
      - name: Check Linux Executable
        run: |
          EXE="build/gobang"

          if [ ! -x "$EXE" ]; then
            echo "ERROR: Executable not found:"
            echo "$EXE"
            find build \
              -maxdepth 2 \
              -print
            exit 1
          fi

          echo "Executable found:"
          echo "$EXE"
          file "$EXE"


      # --------------------------------------------------------
      # Deploy Qt (拷贝运行库 + 插件 + 修正 rpath)
      # --------------------------------------------------------
      - name: Deploy Qt Linux
        run: |
          EXE="build/gobang"
          DIST="dist"
          QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)

          echo "========================================"
          echo "Copy executable and Qt libraries"
          echo "========================================"

          rm -rf "$DIST"
          mkdir -p "$DIST/lib" "$DIST/plugins"

          cp "$EXE" "$DIST/"

          # Qt 运行库
          ldd "$EXE" \
            | grep -oE '/[^ ]*libQt6[^ ]*' \
            | sort -u \
            | while read -r lib; do
                cp "$lib" "$DIST/lib/"
                echo "copied: $lib"
              done

          # ICU 库(部分发行版不预装)
          ldd "$EXE" \
            | grep -oE '/[^ ]*libicu[^ ]*' \
            | sort -u \
            | while read -r lib; do
                cp "$lib" "$DIST/lib/"
              done

          # Qt 插件: 平台 / 图片 / 多媒体 / 音频
          cp -r "$QT_PREFIX/plugins/platforms" "$DIST/plugins/"
          cp -r "$QT_PREFIX/plugins/imageformats" "$DIST/plugins/"
          if [ -d "$QT_PREFIX/plugins/multimedia" ]; then
            cp -r "$QT_PREFIX/plugins/multimedia" "$DIST/plugins/"
          fi
          if [ -d "$QT_PREFIX/plugins/audio" ]; then
            cp -r "$QT_PREFIX/plugins/audio" "$DIST/plugins/"
          fi

          # 插件依赖库 (libjpeg/libpng/libav* 等, 目标机可能缺失):
          # 排除 glibc/gcc 运行时核心, 其余全部拷入 dist/lib
          # (插件 rpath 已指向 $ORIGIN/../../lib, 可从此目录加载)
          for so in $(find "$DIST/plugins" -name '*.so'); do
            ldd "$so" \
              | grep -oE '/[^ ]*\.so(\.[0-9]+)*' \
              | grep -vE '/(libc|libm|libgcc_s|libstdc\+\+|ld-linux[^ ]*|libpthread|libdl|librt)\.so(\.|$)' \
              | sort -u \
              | while read -r lib; do
                  cp -n "$lib" "$DIST/lib/" 2>/dev/null || true
                done
          done

          # 修正 rpath: 可执行文件 -> lib/, 插件 -> 上级 lib/
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --set-rpath '$ORIGIN/lib' "$DIST/gobang"
          find "$DIST/plugins" -name '*.so' \
            -exec patchelf --set-rpath '$ORIGIN/../../lib' {} \;

          echo ""
          echo "Deploy output:"
          find "$DIST" -maxdepth 3 -print


      # --------------------------------------------------------
      # Slim Linux Bundle（减包: 52MB -> ~42MB）
      #   删除误带的 QML 模块簇（纯 Widgets 应用不用 QML; 已验证无任何
      #   非 QML 库引用它们, 是插件依赖递归收集时带入）
      #   ffmpeg(libav*) 是 Linux QMediaPlayer 必需后端, 保留
      # --------------------------------------------------------
      - name: Slim Linux Bundle
        run: |
          rm -f dist/lib/libQt6Qml*.so* dist/lib/libQt6Quick*.so*
          echo "--- 瘦身后体积 ---"
          du -sh dist


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------
      - name: Package Linux
        run: |
          cd dist
          rm -f "$GITHUB_WORKSPACE/gobang-linux.zip"
          zip -r "$GITHUB_WORKSPACE/gobang-linux.zip" .
          echo ""
          echo "Package created:"
          echo "$GITHUB_WORKSPACE/gobang-linux.zip"


      # --------------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------------
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-linux
          path: gobang-linux.zip

      # tag 触发时发布到 GitHub Release（body 与其他 job 相同，无冲突）
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -E '^(feat|fix)' | sed 's/^/- /' > RELEASE_NOTES.md || true
          echo "== Changelog =="
          cat RELEASE_NOTES.md
      - name: Publish Linux Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gobang-linux.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false

  # ============================================================
  # 上传 Release 资产到 CNB（等三端构建全部完成后执行）
  # 前置: CNB 仓库已有该 tag 对应的 release（.cnb.yml tag_push 自动创建）
  # 依赖: GIT_PASSWORD secret（CNB 访问令牌）
  # 实现: 用 cnbcool/attachments 插件（fork: ryanuo/attachments, set-output 已做
  #       GitHub Actions 兼容: GITHUB_ACTIONS 环境写 $GITHUB_OUTPUT, 不再输出
  #       Drone 格式 ##[set-output, 避免 GitHub 报 "Required field 'name' is missing"）。
  #       官方合并后可将 clone 地址换回官方仓库。
  # ============================================================
  upload-cnb:
    name: Upload Assets to CNB Release
    needs: [build-windows, build-macos, build-linux]
    # tag 触发自动跑；workflow_dispatch 用于手动验证（配合 inputs.cnb_tag 指定目标 release）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # 汇总三端 zip（artifact 名互不相同，merge 后都在 dist/ 下）
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Clone attachments plugin (fork)
        run: git clone --depth 1 https://cnb.cool/ryanuo/attachments.git plugin

      - name: Build plugin
        working-directory: plugin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload to CNB Release
        id: upload
        env:
          CNB_TOKEN: ${{ secrets.GIT_PASSWORD }}
          CNB_API_ENDPOINT: 'https://api.cnb.cool'
          CNB_REPO_SLUG: 'ryanuo/cpp-wzq'
          PLUGIN_TAG: ${{ inputs.cnb_tag || github.ref_name }}
          PLUGIN_ATTACHMENTS: './dist/*.zip'
        run: node plugin/dist/entrypoint.js
